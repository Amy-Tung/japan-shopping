<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f8f7"><title>日本代購小清單</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f9f8f7;--text:#2c2c2b;--muted:#68645f;--border:#d2d0cc;--accent:#176abd;--tint:#e5f2fc;--error:#aa3028;--focus:#176abd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:1000px;margin:auto;padding:32px 24px}header{margin-bottom:24px}h1{font-size:30px;letter-spacing:-.5px;margin:0 0 8px}p{margin:0}.hint{font-size:14px;color:var(--muted)}.layout{display:grid;grid-template-columns:1.3fr 1fr;align-items:start;gap:24px}.panel{border:1px solid var(--border);border-radius:12px;padding:24px;min-width:0}h2{font-size:20px;margin:0} .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.labels,.row{display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:8px}.labels{font-size:14px;color:var(--muted);margin-bottom:8px}.row{margin-bottom:12px}.row input{width:100%}.row button{padding:0;font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,input,textarea{font:inherit}button{min-height:44px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:8px 12px;cursor:pointer}button:hover{background:var(--surface)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.primary:hover{background:var(--accent);filter:brightness(.93)}input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:0}input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.summary{background:var(--surface)}.summary h2{margin-bottom:20px}.line{display:flex;justify-content:space-between;gap:16px;margin:12px 0}.line strong{text-align:right;overflow-wrap:anywhere}.total{background:var(--tint);border-radius:8px;padding:20px;margin:20px 0}.amount{font-size:36px;line-height:1.2;font-weight:700;margin:8px 0;overflow-wrap:anywhere;color:var(--accent);font-variant-numeric:tabular-nums}#copy{width:100%;margin-top:12px}#copyTextBox{display:block;width:100%;height:224px;resize:vertical;margin-top:8px;font-size:14px;line-height:1.6}#error,#importError{color:var(--error);font-size:14px;white-space:pre-wrap}#error:empty{display:none}#error{margin-top:12px}#status{padding:16px;margin-top:12px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-weight:600}#status.success{background:#e8f1ec;color:#246044;border-color:#8eb9a1}#status.notice{background:#fbebde;color:#7a431d;border-color:#cda582}.name-label{display:block;font-weight:600;margin-bottom:8px}.buyer-input{width:100%;margin-bottom:24px}a{color:var(--accent)}#rateError{margin-top:12px;color:var(--error)}#retryRate{margin-top:8px}
.calculation{border-top:1px solid var(--border);margin-top:20px;padding-top:8px}summary{cursor:pointer;min-height:44px;align-content:center;font-size:14px;color:var(--muted)}.calculation p{font-size:14px;color:var(--muted);margin-bottom:12px}.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rate input{width:110px}footer{font-size:14px;color:var(--muted);margin-top:20px}dialog{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:24px;width:min(540px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow-y:auto}dialog::backdrop{background:rgba(0,0,0,.4)}dialog h2{margin:0}dialog .panel-head{margin-bottom:12px}dialog p{margin-bottom:16px}#importText{width:100%;height:180px;resize:vertical;display:block;margin-top:8px}#importPreview{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:16px;font-size:14px}#importList{margin:0 0 12px;padding-left:20px;max-height:110px;overflow-y:auto;overflow-wrap:anywhere}#importError{margin-top:12px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.close{width:44px;padding:0;font-size:22px} [hidden]{display:none!important}@media(max-width:650px){main{padding:24px 16px}.layout{grid-template-columns:1fr;gap:16px}.panel{padding:20px}h1{font-size:27px}.row,.labels{grid-template-columns:minmax(0,1fr) 110px 44px}.amount{font-size:34px}dialog{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#202020;--text:#fff;--muted:#bab8b4;--border:#62615f;--accent:#5e9fe8;--tint:#223143;--error:#ff9287;--focus:#5e9fe8}.primary{color:#191919}#status.success{background:#20372b;color:#b3e7c8;border-color:#659b79}#status.notice{background:#3b2c20;color:#f6d5b6;border-color:#b18a62}}
</style>
</head><body><main>
<header><h1>日本代購小清單</h1><p class="hint">把想買的東西記下來，看看台幣大約多少。</p></header>
<div class="layout">
<section class="panel" aria-labelledby="itemsTitle">
<label for="buyerName" class="name-label">訂購人姓名</label><input id="buyerName" class="buyer-input" type="text" placeholder="名字或暱稱" maxlength="100" autocomplete="off" required>
<div class="panel-head"><h2 id="itemsTitle">想買的東西</h2><button id="openImport">匯入明細</button></div>
<div class="labels" aria-hidden="true"><span>商品名稱（選填）</span><span>含稅日幣金額</span><span></span></div>
<div id="items"></div><div class="actions"><button id="add">＋ 新增商品</button><button id="example">看個範例</button><button id="clear">新清單</button></div><p id="error" role="alert"></p>
</section>
<section class="panel summary" aria-labelledby="summaryTitle"><h2 id="summaryTitle">清單合計</h2>
<div class="line"><span>日幣加總</span><strong id="yen">¥0</strong></div>
<div class="total" aria-live="polite"><p class="hint">要給 Amy 的錢</p><p class="amount" id="pay">NT$0</p></div>
<label class="hint" for="copyTextBox">明細文字</label><textarea id="copyTextBox" readonly placeholder="填入商品金額後，明細會顯示在這裡。" aria-label="即將複製的明細"></textarea>
<button class="primary" id="copy" disabled>複製明細</button><p id="status" role="status" aria-live="polite" hidden></p><p id="rateError" role="alert" class="hint" hidden></p><button id="retryRate" hidden>重新取得匯率</button>
<details class="calculation" id="calculation"><summary>計算方式</summary><p>商品含稅日幣先加總，再以台銀日圓現金賣出匯率換算。匯率無條件進位到小數點第二位，這份清單開始後就會保留。</p><p>台幣金額：十位數四捨五入為 00 或 50。多件同款請填合計日幣金額。</p><p id="rateInfo">正在取得匯率…</p><p>資料來源：<a href="https://rate.bot.com.tw/xrt?Lang=zh-TW" target="_blank" rel="noopener noreferrer">臺灣銀行</a>（經公開同步資料讀取）<br>資料整理：<a href="https://app.haotool.org/ratewise/" target="_blank" rel="noopener noreferrer">匯率好工具 RateWise</a></p></details>
</section></div>
<footer id="storageNote">清單只留在這個瀏覽器，不會送出訂單。換裝置時可以貼上明細繼續編輯。</footer>
</main>
<dialog id="importDialog" aria-labelledby="importTitle" aria-describedby="importDescription">
<div class="panel-head"><h2 id="importTitle">匯入明細</h2><button class="close" id="closeImport" aria-label="關閉匯入">×</button></div>
<p class="hint" id="importDescription">貼上完整明細，商品就會加入目前清單。</p>
<label for="importText">明細文字</label><textarea id="importText" placeholder="在這裡貼上整份明細…" spellcheck="false" maxlength="200000"></textarea>
<p id="importError" role="alert"></p><div class="dialog-actions"><button class="primary" id="applyImport">加入清單</button></div>
</dialog>
<script src="scripts/rates.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),key='japan-shopping-v2';
let state={buyer:'',items:[{name:'',price:''}],quote:null},current=null,loadingRate=false,rateError='',rateRun=0;
function validRate(rate){return typeof rate==='string'&&/^(?:0)(?:\.\d{2})$/.test(rate)&&Number(rate)>0}
function validQuote(q){try{return q&&validRate(q.rate)&&RateSource.ceilToCents(q.raw)===q.rate&&Number.isFinite(Date.parse(q.obtainedAt))&&Number.isFinite(Date.parse(q.publishedAt))&&Number.isFinite(Date.parse(q.checkedAt))}catch{return false}}
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved.buyer==='string'&&Array.isArray(saved.items)&&saved.items.length&&saved.items.length<=1000&&saved.items.every(i=>typeof i.name==='string'&&typeof i.price==='string')){state={buyer:saved.buyer,items:saved.items,quote:validQuote(saved.quote)?saved.quote:null};if(!state.buyer&&!state.items.some(i=>i.name||i.price))state.quote=null}else{const old=JSON.parse(localStorage.getItem('japan-shopping-calculator-v1'));if(old&&Array.isArray(old.items)&&old.items.length&&old.items.every(i=>typeof i.name==='string'&&typeof i.price==='string'))state.items=old.items.slice(0,1000)}}catch{}
function group(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function sumItems(items){let total=0n,filled=0;for(const item of items){const price=item.price.trim().replace(/,/g,'');if(!price){if(item.name.trim())throw Error('這個商品還沒填金額。');continue}if(!/^\d{1,15}$/.test(price))throw Error('日幣金額請填 0 或正整數，最多 15 位數。');total+=BigInt(price);filled++}return{total,filled}}
function calculate(items,rate){if(!validRate(rate))throw Error('匯率尚未取得。');const s=sumItems(items),cents=BigInt(rate.replace('.',''));return{...s,rounded:(s.total*cents+2500n)/5000n*50n,rate}}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('storageNote').textContent='這個瀏覽器暫時無法保留清單。離開前，記得複製明細。'}}
function setStatus(message,type='notice'){$('status').textContent=message;$('status').className=type;$('status').hidden=!message}
function dateText(date){return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(date))}
function compute(){current=null;setStatus('');$('copy').textContent='複製明細';$('error').textContent='';try{const sums=sumItems(state.items);$('yen').textContent='¥'+group(sums.total);if(state.quote){current=calculate(state.items,state.quote.rate);$('pay').textContent='NT$'+group(current.rounded)}else $('pay').textContent=loadingRate?'取得匯率中…':'—'}catch(e){$('error').textContent=e.message;$('yen').textContent=$('pay').textContent='—'}$('copy').disabled=!(current&&current.filled&&state.buyer.trim());$('copyTextBox').value=getText();$('copyTextBox').placeholder=state.buyer.trim()?'填入商品金額後，明細會顯示在這裡。':'填入訂購人姓名與商品金額後，明細會顯示在這裡。';$('rateError').hidden=!rateError;$('rateError').textContent=rateError;$('retryRate').hidden=!rateError||loadingRate;$('rateInfo').textContent=state.quote?`這份清單採用 ${state.quote.rate}；台銀現金賣出 ${state.quote.raw}。資料公告 ${dateText(state.quote.publishedAt)}，同步查核 ${dateText(state.quote.checkedAt)}。`:(loadingRate?'正在取得匯率…':'尚未取得匯率。');save()}
async function loadRate(){if(state.quote)return;const run=++rateRun;loadingRate=true;rateError='';compute();try{const quote=await RateSource.getQuote();if(run!==rateRun)return;state.quote=quote}catch(e){if(run!==rateRun)return;rateError='暫時無法取得有效匯率，請稍後重試。'}finally{if(run===rateRun){loadingRate=false;compute()}}}
function render(){const container=$('items');container.replaceChildren();state.items.forEach((item,index)=>{const row=document.createElement('div');row.className='row';const name=document.createElement('input');name.placeholder='例如：餅乾';name.value=item.name;name.maxLength=500;name.setAttribute('aria-label',`商品 ${index+1} 名稱`);name.addEventListener('input',()=>{item.name=name.value;compute()});const price=document.createElement('input');price.type='text';price.inputMode='numeric';price.placeholder='¥ 0';price.value=item.price;price.maxLength=30;price.setAttribute('aria-label',`商品 ${index+1} 含稅日幣金額`);price.addEventListener('input',()=>{item.price=price.value;compute()});const remove=document.createElement('button');remove.textContent='×';remove.setAttribute('aria-label',`移除商品 ${index+1}`);remove.addEventListener('click',()=>{state.items.splice(index,1);if(!state.items.length)state.items.push({name:'',price:''});render();compute();$('items').querySelector('input').focus()});row.append(name,price,remove);container.append(row)})}
function getText(){if(!current||!current.filled)return '';const lines=['日本代購小清單',`訂購人：${state.buyer.trim()||'尚未填寫'}`,'','商品明細'];state.items.forEach((item,index)=>{if(item.price.trim())lines.push(`${item.name.trim().replace(/[\r\n]+/g,' ')||'商品 '+(index+1)}：¥${group(BigInt(item.price.trim().replace(/,/g,'')))}`)});lines.push('',`日幣加總：¥${group(current.total)}`,`要給 Amy 的錢：NT$${group(current.rounded)}`);return lines.join('\n')}
function selectText(){const box=$('copyTextBox');box.focus({preventScroll:true});box.select();box.setSelectionRange(0,box.value.length)}
async function copyText(){const text=getText();if(!text||!state.buyer.trim())return;$('copy').textContent='複製明細';setStatus('');$('copyTextBox').value=text;let copied=false;try{if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){await navigator.clipboard.writeText(text);copied=true}}catch{}if(!copied){selectText();try{copied=document.execCommand('copy')}catch{}}if(copied){setStatus('✓ 明細已複製，可以貼到 LINE 或筆記本。','success');$('copy').textContent='已複製明細 ✓'}else{selectText();setStatus('無法自動複製。請長按上方文字框，選擇「全選」再「複製」。','notice')}$('status').scrollIntoView({behavior:'auto',block:'nearest'})}
function parseImport(raw){if(raw.length>200000)throw Error('明細太長，請分成較小的清單。');const text=raw.replace(/\r\n?/g,'\n').trim();if(!text)throw Error('先貼上完整明細。');const lines=text.split('\n').map(s=>s.trim());const title=lines.shift(),modern=title==='日本代購小清單';if(!modern&&title!=='日本代購付款明細')throw Error('請貼上這個工具複製的完整明細。');let buyer='';if(lines[0]?.startsWith('訂購人：')||lines[0]?.startsWith('訂購人:')){buyer=lines.shift().replace(/^訂購人[：:]\s*/,'');if(buyer==='尚未填寫'||buyer==='未填姓名')buyer='';if(buyer.length>100)throw Error('訂購人姓名太長。')}while(lines[0]==='')lines.shift();if(modern&&lines.shift()!=='商品明細')throw Error('找不到商品明細，請貼上完整內容。');const items=[];while(lines.length&&lines[0]!==''){const line=lines.shift(),m=line.match(/^(.+)[：:]\s*[¥￥]\s*(\d[\d,]*)$/);if(!m)throw Error('有一行商品讀不到：'+line.slice(0,80));const price=m[2].replace(/,/g,'');if(!/^\d{1,15}$/.test(price)||m[1].length>500)throw Error('商品名稱或金額太長。');items.push({name:m[1].trim(),price});if(items.length>1000)throw Error('一份清單最多 1,000 項商品。')}if(!items.length)throw Error('明細裡沒有找到商品。');const fields={};const notes=new Set(['合計後取最接近的 NT$50。','金額已四捨五入至最接近 NT$50。','匯率已含代購報酬，不另收代購費。']);for(const line of lines){if(!line||notes.has(line))continue;let m,field,value;if(m=line.match(/^(?:日幣加總|日幣合計|日幣含稅總額)[：:]\s*[¥￥]\s*([\d,]+)$/)){field='total';value=m[1].replace(/,/g,'')}else if(m=line.match(/^採用匯率[：:]\s*1\s*日圓\s*=\s*NT\$\s*(\d+(?:\.\d{1,6})?)$/)){field='rate';value=m[1]}else if(m=line.match(/^換算台幣[：:]\s*NT\$\s*(\d[\d,]*(?:\.\d{1,6})?)$/)){field='twd';value=m[1]}else if(m=line.match(/^(?:要給 Amy 的錢|清單金額|最後需支付)[：:]\s*NT\$\s*([\d,]+)$/)){field='rounded';value=m[1].replace(/,/g,'')}else throw Error('有一行讀不到：'+line.slice(0,80));if(fields[field]!==undefined)throw Error('請只貼上一份明細。');fields[field]=value}if(!/^\d+$/.test(fields.total||'')||!/^\d+$/.test(fields.rounded||''))throw Error('明細少了合計金額，請貼上完整內容。');if(sumItems(items).total!==BigInt(fields.total))throw Error('日幣合計與商品金額對不起來，請貼上完整的原始明細。');return{buyer,items}}
$('buyerName').value=state.buyer;$('buyerName').addEventListener('input',()=>{state.buyer=$('buyerName').value;compute()});$('copy').addEventListener('click',copyText);$('copyTextBox').addEventListener('click',selectText);$('retryRate').addEventListener('click',loadRate);
$('add').addEventListener('click',()=>{if(state.items.length>=1000){$('error').textContent='一份清單最多 1,000 項商品。';return}state.items.push({name:'',price:''});render();compute();$('items').lastElementChild.querySelector('input').focus()});
$('example').addEventListener('click',()=>{if(state.items.some(i=>i.name||i.price)&&!confirm('換成範例商品？目前商品會被取代。'))return;state.items=[{name:'範例商品',price:'8480'}];render();compute()});
$('clear').addEventListener('click',()=>{if((state.buyer||state.items.some(i=>i.name||i.price))&&!confirm('開始新的清單？目前內容會清空。'))return;rateRun++;state={buyer:'',items:[{name:'',price:''}],quote:null};$('buyerName').value='';render();loadRate();$('buyerName').focus()});
$('openImport').addEventListener('click',()=>{$('importText').value='';$('importError').textContent='';$('importDialog').showModal();$('importText').focus()});$('closeImport').addEventListener('click',()=>$('importDialog').close());$('importText').addEventListener('input',()=>{$('importError').textContent=''});
$('applyImport').addEventListener('click',()=>{try{const incoming=parseImport($('importText').value);const existing=state.items.filter(i=>i.name.trim()||i.price.trim());if(existing.length+incoming.items.length>1000)throw Error('加入後超過 1,000 項商品，請另開一份清單。');state.items=[...existing,...incoming.items];if(!state.buyer.trim()&&incoming.buyer){state.buyer=incoming.buyer;$('buyerName').value=state.buyer}render();compute();$('importDialog').close();setStatus(`✓ 已加入 ${incoming.items.length} 項商品。`,'success')}catch(e){$('importError').textContent=e.message}});
render();compute();if(!state.quote)loadRate();
</script>
</body></html>
